<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 灵感库 - 创作灵感管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 24px 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; font-size: 26px; color: #fff; margin-bottom: 8px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .subtitle { text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 28px; font-size: 14px; }
        
        .stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: rgba(255,255,255,0.95); border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stat-num { font-size: 28px; font-weight: 700; color: #1a202c; }
        .stat-label { font-size: 13px; color: #718096; margin-top: 4px; }
        
        .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(245,87,108,0.4); margin-bottom: 20px; transition: transform 0.2s; }
        .add-btn:hover { transform: translateY(-2px); }
        
        .search-box { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .search-input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #667eea; }
        
        .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .filter-row select { padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 13px; background: #fff; outline: none; cursor: pointer; }
        
        .card { background: #fff; border-radius: 16px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
        
        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
        .tag-platform { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .tag-type { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        .tag-subject { background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #fff; }
        .tag-status { background: #e2e8f0; color: #4a5568; }
        .tag-status.pending { background: #fed7aa; color: #c05621; }
        .tag-status.doing { background: #bee3f8, #2b6cb0; color: #2b6cb0; }
        .tag-status.done { background: #c6f6d5; color: #276749; }
        
        .content { padding: 0 20px 16px; font-size: 15px; color: #2d3748; line-height: 1.6; }
        
        .suggestions { margin: 0 20px 16px; background: linear-gradient(135deg, #f5f7ff 0%, #fae8ff 100%); border-radius: 12px; padding: 16px; }
        .suggestions-title { font-size: 14px; font-weight: 600; color: #667eea; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .suggestion-item { font-size: 14px; color: #4a5568; padding: 6px 0; display: flex; align-items: flex-start; gap: 8px; }
        .suggestion-bullet { color: #f5576c; font-weight: bold; }
        
        .card-footer { padding: 12px 20px; background: #f7fafc; display: flex; justify-content: space-between; align-items: center; }
        .date { font-size: 12px; color: #a0aec0; }
        .actions { display: flex; gap: 8px; }
        .action-btn { padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; background: #fff; cursor: pointer; transition: all 0.2s; }
        .action-btn:hover { background: #f7fafc; }
        .action-btn.delete { color: #e53e3e; border-color: #feb2b2; }
        .action-btn.delete:hover { background: #fff5f5; }
        
        .status-select { padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; background: #fff; outline: none; cursor: pointer; }
        
        .empty { text-align: center; padding: 40px; color: rgba(255,255,255,0.8); }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e2e8f0; }
        .modal-title { font-size: 18px; font-weight: 700; color: #1a202c; }
        .modal-body { padding: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: #4a5568; margin-bottom: 6px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #667eea; }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .modal-btn.cancel { background: #fff; border: 1px solid #e2e8f0; color: #4a5568; }
        .modal-btn.cancel:hover { background: #f7fafc; }
        .modal-btn.submit { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; }
        .modal-btn.submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        
        .footer { text-align: center; padding: 20px; color: rgba(255,255,255,0.7); font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 灵感库</h1>
        <p class="subtitle">记录创作灵感，AI 辅助创作建议</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-num" id="stat-total">0</div>
                <div class="stat-label">总灵感</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-pending" style="color: #ed8936;">0</div>
                <div class="stat-label">待创作</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-done" style="color: #48bb78;">0</div>
                <div class="stat-label">已发布</div>
            </div>
        </div>
        
        <button class="add-btn" onclick="openModal()">
            <span>➕</span> 添加灵感
        </button>
        
        <div class="search-box">
            <input type="text" class="search-input" id="search" placeholder="🔍 搜索灵感..." oninput="renderList()">
            <div class="filter-row">
                <select onchange="updateFilter('platform', this.value)">
                    <option value="">全部平台</option>
                    <option value="小红书">小红书</option>
                    <option value="微信">微信</option>
                    <option value="微博">微博</option>
                    <option value="即刻">即刻</option>
                    <option value="B站">B站</option>
                    <option value="其他">其他</option>
                </select>
                <select onchange="updateFilter('type', this.value)">
                    <option value="">全部类型</option>
                    <option value="文字">文字</option>
                    <option value="视频">视频</option>
                </select>
                <select onchange="updateFilter('subject', this.value)">
                    <option value="">全部题材</option>
                    <option value="资讯">资讯</option>
                    <option value="测评">测评</option>
                    <option value="长文">长文</option>
                    <option value="个人分享">个人分享</option>
                </select>
                <select onchange="updateFilter('status', this.value)">
                    <option value="">全部状态</option>
                    <option value="待创作">待创作</option>
                    <option value="进行中">进行中</option>
                    <option value="已发布">已发布</option>
                    <option value="归档">归档</option>
                </select>
            </div>
        </div>
        
        <div id="list"></div>
        
        <div class="footer">
            💾 数据已保存在浏览器本地 + GitHub
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">添加新灵感</div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">灵感内容</label>
                    <textarea class="form-textarea" id="new-content" placeholder="描述你的创作灵感..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">平台</label>
                        <select class="form-select" id="new-platform">
                            <option value="小红书">小红书</option>
                            <option value="微信">微信</option>
                            <option value="微博">微博</option>
                            <option value="即刻">即刻</option>
                            <option value="B站">B站</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">类型</label>
                        <select class="form-select" id="new-type">
                            <option value="文字">文字</option>
                            <option value="视频">视频</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">题材</label>
                        <select class="form-select" id="new-subject">
                            <option value="资讯">资讯</option>
                            <option value="测评">测评</option>
                            <option value="长文">长文</option>
                            <option value="个人分享">个人分享</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="new-status">
                            <option value="待创作">待创作</option>
                            <option value="进行中">进行中</option>
                            <option value="已发布">已发布</option>
                            <option value="归档">归档</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn submit" onclick="addInspiration()">保存</button>
            </div>
        </div>
    </div>
    
    <script>
        let inspirations = JSON.parse(localStorage.getItem('inspirations') || '[]');
        let filters = { platform: '', type: '', subject: '', status: '' };
        
        const suggestionTemplates = {
            小红书: {
                文字: { 资讯: ['「XX领域最新消息，3分钟看懂」', '「揭秘：XX背后的真相」', '「2024年XX趋势，不看后悔」'], 测评: ['「XX天使用感受｜真实测评」', '「XX到底值不值？买前必看」'], 长文: ['「一篇讲透XX，建议收藏」', '「深度｜XX的全方位解读」'], 个人分享: ['「普通人XX的真实经历」', '「XX1年，我后悔没早点知道」'] },
                视频: { 资讯: ['「60秒XX快讯」'], 测评: ['「XX开箱/测评视频」'], 长文: ['「XX深度vlog」'], 个人分享: ['「我的XX日常volg」'] }
            },
            微信: {
                文字: { 资讯: ['「XX解读：一场行业变革」', '「重磅｜XX最新消息」'], 测评: ['「深度测评｜XX到底好不好」'], 长文: ['「万字长文｜XX深度解析」'], 个人分享: ['「我的XX故事」'] },
                视频: { 资讯: ['「XX视频新闻」'], 测评: ['「XX视频测评」'], 长文: ['「XX深度访谈/纪录片」'], 个人分享: ['「XX人物专访」'] }
            },
            其他: {
                文字: { 资讯: ['「XX快讯」'], 测评: ['「XX测评」'], 长文: ['「XX深度好文」'], 个人分享: ['「我的XX」'] },
                视频: { 资讯: ['「XX视频快讯」'], 测评: ['「XX视频测评」'], 长文: ['「XX深度视频」'], 个人分享: ['「XX vlog」'] }
            }
        };
        
        function generateSuggestions(platform, type, subject) {
            const p = suggestionTemplates[platform] || suggestionTemplates['其他'];
            const t = p[type] || p['文字'];
            return t[subject] || t['个人分享'];
        }
        
        function init() {
            renderList();
            updateStats();
        }
        
        function updateFilter(key, value) {
            filters[key] = value;
            renderList();
        }
        
        function renderList() {
            const search = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('list');
            
            const filtered = inspirations.filter(item => {
                const matchesSearch = item.content.toLowerCase().includes(search);
                const matchesPlatform = !filters.platform || item.platform === filters.platform;
                const matchesType = !filters.type || item.type === filters.type;
                const matchesSubject = !filters.subject || item.subject === filters.subject;
                const matchesStatus = !filters.status || item.status === filters.status;
                return matchesSearch && matchesPlatform && matchesType && matchesSubject && matchesStatus;
            });
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">💡</div><p>还没有灵感，开始记录你的第一个想法吧！</p></div>';
                return;
            }
            
            list.innerHTML = filtered.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div class="tags">
                            <span class="tag tag-platform">${item.platform}</span>
                            <span class="tag tag-type">${item.type}</span>
                            <span class="tag tag-subject">${item.subject}</span>
                            <span class="tag tag-status ${item.status === '待创作' ? 'pending' : item.status === '进行中' ? 'doing' : item.status === '已发布' ? 'done' : ''}">${item.status}</span>
                        </div>
                    </div>
                    <div class="content">${item.content}</div>
                    <div class="suggestions">
                        <div class="suggestions-title">💡 创作建议</div>
                        ${(item.suggestions || []).map(s => `<div class="suggestion-item"><span class="suggestion-bullet">•</span>${s}</div>`).join('')}
                    </div>
                    <div class="card-footer">
                        <span class="date">${item.createdAt}</span>
                        <div class="actions">
                            <select class="status-select" onchange="updateStatus('${item.id}', this.value)">
                                <option value="待创作" ${item.status === '待创作' ? 'selected' : ''}>待创作</option>
                                <option value="进行中" ${item.status === '进行中' ? 'selected' : ''}>进行中</option>
                                <option value="已发布" ${item.status === '已发布' ? 'selected' : ''}>已发布</option>
                                <option value="归档" ${item.status === '归档' ? 'selected' : ''}>归档</option>
                            </select>
                            <button class="action-btn delete" onclick="deleteInspiration('${item.id}')">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('stat-total').textContent = inspirations.length;
            document.getElementById('stat-pending').textContent = inspirations.filter(i => i.status === '待创作').length;
            document.getElementById('stat-done').textContent = inspirations.filter(i => i.status === '已发布').length;
        }
        
        function addInspiration() {
            const content = document.getElementById('new-content').value.trim();
            if (!content) return;
            
            const platform = document.getElementById('new-platform').value;
            const type = document.getElementById('new-type').value;
            const subject = document.getElementById('new-subject').value;
            const status = document.getElementById('new-status').value;
            
            const item = {
                id: Date.now().toString(),
                content,
                platform,
                type,
                subject,
                status,
                suggestions: generateSuggestions(platform, type, subject),
                createdAt: new Date().toLocaleString('zh-CN')
            };
            
            inspirations.unshift(item);
            localStorage.setItem('inspirations', JSON.stringify(inspirations));
            closeModal();
            renderList();
            updateStats();
        }
        
        function updateStatus(id, status) {
            const item = inspirations.find(i => i.id === id);
            if (item) {
                item.status = status;
                localStorage.setItem('inspirations', JSON.stringify(inspirations));
                updateStats();
            }
        }
        
        function deleteInspiration(id) {
            if (confirm('确定删除这个灵感吗？')) {
                inspirations = inspirations.filter(i => i.id !== id);
                localStorage.setItem('inspirations', JSON.stringify(inspirations));
                renderList();
                updateStats();
            }
        }
        
        function openModal() {
            document.getElementById('modal').classList.add('show');
            document.getElementById('new-content').value = '';
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }
        
        init();
    </script>
</body>
</html>
